let rkMode=&quot;type&quot;,curList=null,rkPage=1;const RKP=10;

function fillSel(){const names=Object.keys(sets());document.getElementById(&quot;rank_sel&quot;).innerHTML=names.map(n=>`<option>${n}</option>`).join(&quot;&quot;);curList=names[0]||null;

// 首屏轮播 + 海报画像
(function(){const C=D.carousel||[];
  document.getElementById(&quot;carousel&quot;).innerHTML=C.length?C.map(c=>`<div class=&quot;card-c&quot;><a href=&quot;${c.page_url}&quot; target=&quot;_blank&quot;>
    <img src=&quot;${c.banner_image}&quot; loading=&quot;lazy&quot; onerror=&quot;this.style.opacity=.2&quot;/>
    <div class=&quot;cc&quot;><div class=&quot;ct&quot;>${c.tier&amp;&amp;c.tier!=='-'?`<span class=&quot;tier ${tcl(c.tier)}&quot;>${c.tier}</span> `:''}${c.title}</div>
    <div class=&quot;cm&quot;>${c.is_new?'<span class=&quot;b-new&quot;>新</span> ':''}${c.on_rank?'<span class=&quot;b-rank&quot;>榜</span> ':''}${(c.poster&amp;&amp;c.poster.tone)?c.poster.tone+'调·IP'+(c.poster.ip_level||''):''}</div>

    const tones=cnt(p=>p.tone),warm=cnt(p=>p.warm),sat=cnt(p=>p.colorful),ip=cnt(p=>p.ip_level);
    const avgS=(ps.reduce((s,p)=>s+p.saturation,0)/ps.length).toFixed(2),avgB=(ps.reduce((s,p)=>s+p.brightness,0)/ps.length).toFixed(2);

      <div>· <b>明度</b>：均${avgB} · <b>IP表现力</b>：${ip.map(i=>i[0]+`(${i[1]})`).join(&quot;、&quot;)}</div>
      <div style=&quot;margin-top:4px;color:#8a5a12&quot;>→ 获首屏推荐节目画像：${warm[0]?warm[0][0]:''}为主、${sat[0]?sat[0][0]:''}、IP主体${ip[0]?ip[0][0]:''}突出，建议自有内容封面对齐此视觉风格</div></div>`;
  } else document.getElementById(&quot;poster_portrait&quot;).innerHTML='<div style=&quot;color:var(--ink-soft);font-size:12px;padding:8px&quot;>海报视觉分析无数据(图片下载失败或无轮播)</div>';
  function toneColor(t){return {&quot;红&quot;:&quot;#d9534f&quot;,&quot;橙&quot;:&quot;#f0ad4e&quot;,&quot;黄&quot;:&quot;#f7d154&quot;,&quot;绿&quot;:&quot;#5cb85c&quot;,&quot;青&quot;:&quot;#5bc0de&quot;,&quot;蓝&quot;:&quot;#3f7cba&quot;,&quot;紫&quot;:&quot;#9b6dc8&quot;,&quot;粉&quot;:&quot;#e89ab8&quot;}[t]||&quot;#ccc&quot;;}

document.getElementById(&quot;foot&quot;).innerHTML=`爱奇艺·奇巴布 黑马监播 v2 · 全量片库 ${nf(K.online_count)} 节目(${D.meta.pages}页) · 真实采集 ${D.meta.crawl_date} · `+

const INK=&quot;#1B3A5B&quot;,ACCENT=&quot;#C8962D&quot;,TX=&quot;#0052d9&quot;,BLUE=&quot;#3f7cba&quot;,SOFT=&quot;#5A6B7B&quot;,LINE=&quot;#C9D4DE&quot;,GREEN=&quot;#1f7a4d&quot;;

const F={fontFamily:'&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif'};const charts=[];
function mk(id,opt){const el=document.getElementById(id);if(!el)return;let c=echarts.getInstanceByDom(el)||echarts.init(el);c.setOption(opt,true);charts.push(c);}
function tcl(t){return &quot;t-&quot;+(t||&quot;&quot;).replace(&quot;+&quot;,&quot;plus&quot;).replace(&quot;-&quot;,&quot;minus&quot;);}
function nf(n){return n==null?'-':Number(n).toLocaleString();}
const grid={left:40,right:14,top:22,bottom:24};
function barH(id,data,hl){mk(id,{textStyle:F,grid:{left:66,right:28,top:10,bottom:18},tooltip:{},
  xAxis:{type:&quot;value&quot;,axisLabel:{color:SOFT},splitLine:{lineStyle:{color:LINE}}},

  series:[{type:&quot;bar&quot;,barWidth:11,data:data.map((d,i)=>({value:d[1],itemStyle:{color:(hl&amp;&amp;i===data.length-1)?ACCENT:TX,borderRadius:[0,3,3,0]}})),label:{show:true,position:&quot;right&quot;,fontSize:9.5,color:SOFT}}]});}
function pie(id,data){mk(id,{textStyle:F,tooltip:{trigger:&quot;item&quot;},series:[{type:&quot;pie&quot;,radius:[&quot;34%&quot;,&quot;66%&quot;],center:[&quot;50%&quot;,&quot;52%&quot;],
  data:data.map((d,i)=>({name:d[0],value:d[1],itemStyle:{color:PAL[i%PAL.length]}})),label:{fontSize:9.5,color:INK},labelLine:{length:5,length2:5}}]});}
function pager(elId,total,per,cur,onGo){const el=document.getElementById(elId);const pages=Math.max(1,Math.ceil(total/per));
  el.innerHTML=`<button ${cur<=1?'disabled':''} id=&quot;${elId}_p&quot;>‹上一页</button> ${cur}/${pages} <button ${cur>=pages?'disabled':''} id=&quot;${elId}_n&quot;>下一页›</button> · 共${total}`;
  const p=document.getElementById(elId+&quot;_p&quot;),n=document.getElementById(elId+&quot;_n&quot;);if(p)p.onclick=()=>onGo(cur-1);if(n)n.onclick=()=>onGo(cur+1);}

document.getElementById(&quot;subline&quot;).textContent=`${D.meta.platform} · 采集 ${D.meta.crawl_date}`;
document.getElementById(&quot;datanote&quot;).textContent=&quot;ⓘ &quot;+D.meta.note;
const K=D.kpi;
document.getElementById(&quot;kpis&quot;).innerHTML=[
  [&quot;在线节目数&quot;,nf(K.online_count),&quot;全量片库去重(getMVLPage分面)&quot;,&quot;&quot;],

  [&quot;本周最热节目&quot;,K.hottest_program,&quot;🔥热度 &quot;+nf(K.hottest_heat)+(K.hottest_age?&quot; · &quot;+K.hottest_age:&quot;&quot;)+(K.hottest_type?&quot; · &quot;+K.hottest_type:&quot;&quot;),&quot;hot&quot;]
].map(k=>`<div class=&quot;kpi ${k[3]}&quot;><div class=&quot;l&quot;>${k[0]}</div><div class=&quot;v ${String(k[1]).length>8?'sm':''}&quot;>${k[1]}</div><div class=&quot;d&quot;>${k[2]}</div></div>`).join(&quot;&quot;);

// 分析模块
(function(){const a=D.analysis;
  document.getElementById(&quot;an_program&quot;).innerHTML=`<h4>黑马节目 · 热度/类型/分龄</h4>
    <div class=&quot;li&quot;>黑马 <b>${K.dark_program_count}</b> 部 · 均热度 <span class=&quot;big&quot; style=&quot;font-size:15px&quot;>${a.dark_heat_avg}</span></div>
    <div class=&quot;li&quot;>主类型：${(a.dark_top_types||[]).slice(0,4).map(t=>t[0]+`(${t[1]})`).join(&quot;、&quot;)||'-'}</div>
    <div class=&quot;li&quot;>分龄：${(a.dark_top_ages||[]).map(t=>t[0]+`(${t[1]})`).join(&quot;、&quot;)||'-'}</div>
    <div class=&quot;li&quot; style=&quot;margin-top:4px;color:#8a5a12&quot;>趋势推测：${(a.trend_guess||[]).map(t=>`${t.type}(黑马${t.dark_share}% vs 全库${t.full_share}%)`).join(&quot;；&quot;)||'类型分布与全库接近'}</div>`;
  const r=a.carousel_onrank,n=a.carousel_new,t=a.carousel_total||1;
  document.getElementById(&quot;an_carousel&quot;).innerHTML=`<h4>首屏推荐核验</h4>
    <div class=&quot;li&quot;>首屏轮播 <b>${a.carousel_total}</b> 个</div>

    <div class=&quot;li&quot;>其中已上榜(有热度)：<span class=&quot;big&quot; style=&quot;font-size:15px&quot;>${r}</span> / ${t}（${Math.round(r/t*100)}%）</div>
    <div class=&quot;li&quot; style=&quot;color:#8a5a12&quot;>→ 编辑意志=${n>=r?'偏新品冒头':'偏已验证热门'}</div>`;})();

// 黑马节目片单(分页)
let dpPage=1;const DPP=10;
function renderDark(p){dpPage=p;const all=D.darkPrograms;const s=(p-1)*DPP;const rows=all.slice(s,s+DPP);
  document.getElementById(&quot;dark_list&quot;).innerHTML=rows.length?rows.map((x,i)=>`<div class=&quot;frow&quot;><span class=&quot;idx&quot;>${s+i+1}</span>

  pager(&quot;dark_pager&quot;,all.length,DPP,p,renderDark);}
renderDark(1);
(function(){const t=D.darkPrograms[0];document.getElementById(&quot;dark_judge&quot;).innerHTML=t?
  `<b>信号</b> ${t.title}(${t.type}/${t.age}) 上线${t.days}天达${t.tier} 🔥${nf(t.heat)} · <b>动作</b> 评估跟播/采买`:'本周无新上线黑马';})();
pie(&quot;dp_age&quot;,D.darkProgramByAge.length?D.darkProgramByAge:[[&quot;无&quot;,1]]);
barH(&quot;dp_type&quot;,[...(D.darkProgramByType.length?D.darkProgramByType:[[&quot;无&quot;,0]])].reverse(),true);

// 排行榜(切换+筛选+分页)
let rkMode=&quot;type&quot;,curList=null,rkPage=1;const RKP=10;
const sets=()=>rkMode===&quot;type&quot;?D.rankings.typeLists:D.rankings.ageLists;
function fillSel(){const names=Object.keys(sets());document.getElementById(&quot;rank_sel&quot;).innerHTML=names.map(n=>`<option>${n}</option>`).join(&quot;&quot;);curList=names[0]||null;
  const allRows=Object.values(sets()).flat();
  document.getElementById(&quot;rank_fage&quot;).innerHTML='<option value=&quot;&quot;>全部分龄</option>'+[...new Set(allRows.map(r=>r.age))].filter(Boolean).map(a=>`<option>${a}</option>`).join(&quot;&quot;);
  rkPage=1;renderRank();}
function curRows(){let rows=(curList&amp;&amp;sets()[curList])||[];const fa=document.getElementById(&quot;rank_fage&quot;).value;
  if(fa)rows=rows.filter(r=>r.age===fa);return rows;}
function renderRank(){const rows=curRows();const s=(rkPage-1)*RKP;const view=rows.slice(s,s+RKP);
  document.getElementById(&quot;rank_tbl&quot;).innerHTML=`<tr><th class=&quot;rk&quot;>名</th><th>标题</th><th>类型</th><th>分龄</th><th style=&quot;text-align:right&quot;>🔥热度</th><th>tier</th></tr>`+
   (view.length?view.map(r=>`<tr><td class=&quot;rk&quot;>${r.pos}</td><td><a href=&quot;${r.url}&quot; target=&quot;_blank&quot;>${r.title}</a></td><td>${r.type}</td><td>${r.age}</td><td class=&quot;num&quot;>${nf(r.heat)}</td><td>${r.tier?`<span class=&quot;tier ${tcl(r.tier)}&quot;>${r.tier}</span>`:'-'}</td></tr>`).join(&quot;&quot;):'<tr><td colspan=6 style=&quot;color:var(--ink-soft)&quot;>无</td></tr>');
  pager(&quot;rank_pager&quot;,rows.length,RKP,rkPage,p=>{rkPage=p;renderRank();});
  const ac={},tc={};rows.forEach(r=>{ac[r.age]=(ac[r.age]||0)+1;tc[r.type]=(tc[r.type]||0)+1;});
  pie(&quot;rk_age&quot;,Object.entries(ac));barH(&quot;rk_type&quot;,Object.entries(tc).reverse(),true);}
document.querySelectorAll('.tab[data-rk]').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab[data-rk]').forEach(x=>x.classList.remove('on'));t.classList.add('on');rkMode=t.dataset.rk;fillSel();});
[&quot;rank_sel&quot;,&quot;rank_fage&quot;].forEach(id=>document.getElementById(id).onchange=e=>{if(id===&quot;rank_sel&quot;)curList=e.target.value;rkPage=1;renderRank();});
fillSel();

// 结构
mk(&quot;tag_rose&quot;,{textStyle:F,tooltip:{trigger:&quot;item&quot;},series:[{type:&quot;pie&quot;,roseType:&quot;area&quot;,radius:[&quot;16%&quot;,&quot;72%&quot;],center:[&quot;50%&quot;,&quot;52%&quot;],
  data:D.tagStructure.map((d,i)=>({name:d[0],value:d[1],itemStyle:{color:PAL[i%PAL.length]}})),label:{fontSize:9,color:INK},labelLine:{length:4,length2:4}}]});
mk(&quot;age_bar&quot;,{textStyle:F,grid,tooltip:{},xAxis:{type:&quot;category&quot;,data:D.ageStructure.map(d=>d[0]),axisLabel:{color:INK}},
  yAxis:{type:&quot;value&quot;,axisLabel:{color:SOFT},splitLine:{lineStyle:{color:LINE}}},
  series:[{type:&quot;bar&quot;,barWidth:&quot;46%&quot;,data:D.ageStructure.map((d,i)=>({value:d[1],itemStyle:{color:PAL[i%PAL.length],borderRadius:[3,3,0,0]}})),label:{show:true,position:&quot;top&quot;,fontSize:10,color:SOFT}}]});

(function(){const O=D.opportunity;const mx=Math.max(1,...O.map(d=>d[2]));
  mk(&quot;opp&quot;,{textStyle:F,grid:{left:48,right:18,top:16,bottom:38},tooltip:{formatter:p=>`${p.data[4]}·${p.data[5]}<br>供给${p.data[0]}/需求${p.data[1]}<br>热度体量${p.data[2]}`},
    xAxis:{name:&quot;供给百分位 →&quot;,min:0,max:100,nameLocation:&quot;middle&quot;,nameGap:22,splitLine:{lineStyle:{color:LINE,type:&quot;dashed&quot;}}},
    yAxis:{name:&quot;需求百分位 →&quot;,min:0,max:100,nameLocation:&quot;middle&quot;,nameGap:28,splitLine:{lineStyle:{color:LINE,type:&quot;dashed&quot;}}},
    series:[{type:&quot;scatter&quot;,markLine:{silent:true,symbol:&quot;none&quot;,lineStyle:{color:SOFT,opacity:.5},data:[{xAxis:50},{yAxis:50}],label:{show:false}},
      markArea:{silent:true,itemStyle:{opacity:.08},data:[[{xAxis:0,yAxis:50,itemStyle:{color:TX}},{xAxis:50,yAxis:100}],[{xAxis:50,yAxis:50,itemStyle:{color:&quot;#cf7d7d&quot;}},{xAxis:100,yAxis:100}],[{xAxis:50,yAxis:0,itemStyle:{color:ACCENT}},{xAxis:100,yAxis:50}]]},
      label:{show:true,formatter:p=>p.data[4]+&quot;·&quot;+p.data[5],fontSize:8.5,color:INK,position:&quot;right&quot;,distance:3},
      data:O.map(d=>({value:d,symbolSize:Math.max(12,Math.sqrt(d[2]/mx)*42),itemStyle:{color:d[0]<50&amp;&amp;d[1]>=50?TX:(d[0]>=50&amp;&amp;d[1]>=50?&quot;#cf7d7d&quot;:ACCENT),opacity:.82},
        label:{show:true,formatter:d[4]+&quot;·&quot;+d[5],fontSize:8.5,color:d[2]>mx*0.3?&quot;#fff&quot;:INK,position:d[2]>mx*0.3?&quot;inside&quot;:&quot;right&quot;}}))}]});

// 首屏轮播 + 海报画像
(function(){const C=D.carousel||[];
  document.getElementById(&quot;carousel&quot;).innerHTML=C.length?C.map(c=>`<div class=&quot;card-c&quot;><a href=&quot;${c.page_url||c.detail_url}&quot; target=&quot;_blank&quot;>
    <img src=&quot;${c.banner||c.banner_image}&quot; loading=&quot;lazy&quot; onerror=&quot;this.style.opacity=.2&quot;/>
    <div class=&quot;cc&quot;><div class=&quot;ct&quot;>${c.tier&amp;&amp;c.tier!=='-'?`<span class=&quot;tier ${tcl(c.tier)}&quot;>${c.tier}</span> `:''}${c.title}</div>
    <div class=&quot;cm&quot;>${c.is_new?'<span class=&quot;b-new&quot;>新</span> ':''}${c.on_rank?'<span class=&quot;b-rank&quot;>榜</span> ':''}${(c.poster&amp;&amp;c.poster.tone)?c.poster.tone+'调':''}</div>
    <div class=&quot;cm&quot;>${c.primary_tag||c.genre||''}${c.age?'·'+c.age:''} ${c.heat?'· 🔥'+nf(c.heat):''}</div></div></a></div>`).join(&quot;&quot;)
    :'<div style=&quot;padding:12px;color:var(--ink-soft)&quot;>未抓到轮播</div>';
  const ps=C.map(c=>c.poster).filter(p=>p&amp;&amp;p.tone);
  function toneColor(t){return {&quot;红&quot;:&quot;#d9534f&quot;,&quot;橙&quot;:&quot;#f0ad4e&quot;,&quot;黄&quot;:&quot;#f7d154&quot;,&quot;绿&quot;:&quot;#5cb85c&quot;,&quot;青&quot;:&quot;#5bc0de&quot;,&quot;蓝&quot;:&quot;#3f7cba&quot;,&quot;紫&quot;:&quot;#9b6dc8&quot;,&quot;粉&quot;:&quot;#e89ab8&quot;}[t]||&quot;#ccc&quot;;}
  if(ps.length){const cnt=f=>{const m={};ps.forEach(p=>{const k=f(p);m[k]=(m[k]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
    const tones=cnt(p=>p.tone),warm=cnt(p=>p.warm),sat=cnt(p=>p.colorful),ip=cnt(p=>p.ip_level);
    const avgS=(ps.reduce((s,p)=>s+p.saturation,0)/ps.length).toFixed(2),avgB=(ps.reduce((s,p)=>s+p.brightness,0)/ps.length).toFixed(2);
    document.getElementById(&quot;poster_portrait&quot;).innerHTML=`<div style=&quot;font-size:12px;line-height:1.9&quot;>
      <div>· <b>主色调</b>：${tones.slice(0,4).map(t=>`<span class=&quot;swatch&quot; style=&quot;background:${toneColor(t[0])}&quot;></span>${t[0]}(${t[1]})`).join(&quot; &quot;)}</div>
      <div>· <b>冷暖</b>：${warm.map(w=>w[0]+`(${w[1]})`).join(&quot;、&quot;)} · <b>饱和度</b>：均${avgS} ${sat.map(s=>s[0]+`(${s[1]})`).join(&quot;、&quot;)}</div>
      <div>· <b>明度</b>：均${avgB} · <b>IP表现力</b>：${ip.map(i=>i[0]+`(${i[1]})`).join(&quot;、&quot;)}</div>
      <div style=&quot;margin-top:4px;color:#8a5a12&quot;>→ 腾讯首屏画像：${warm[0]?warm[0][0]:''}为主、${sat[0]?sat[0][0]:''}、IP主体${ip[0]?ip[0][0]:''}突出</div></div>`;
  } else document.getElementById(&quot;poster_portrait&quot;).innerHTML='<div style=&quot;color:var(--ink-soft);padding:8px&quot;>海报分析无数据</div>';
})();

document.getElementById(&quot;foot&quot;).innerHTML=`腾讯·小企鹅乐园 少儿监播 · 全量片库 ${nf(K.online_count)}(原始行 ${nf(K.raw_rows)}) · 采集 ${D.meta.crawl_date} · `+

  function toneColor(t){return {&quot;红&quot;:&quot;#d9534f&quot;,&quot;橙&quot;:&quot;#f0ad4e&quot;,&quot;黄&quot;:&quot;#f7d154&quot;,&quot;绿&quot;:&quot;#5cb85c&quot;,&quot;青&quot;:&quot;#5bc0de&quot;,&quot;蓝&quot;:&quot;#3f7cba&quot;,&quot;紫&quot;:&quot;#9b6dc8&quot;,&quot;粉&quot;:&quot;#e89ab8&quot;}[t]||&quot;#ccc&quot;;}
  if(ps.length){const cnt=f=>{const m={};ps.forEach(p=>{const k=f(p);m[k]=(m[k]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
    const tones=cnt(p=>p.tone),warm=cnt(p=>p.warm),sat=cnt(p=>p.colorful),ip=cnt(p=>p.ip_level);
    const avgS=(ps.reduce((s,p)=>s+p.saturation,0)/ps.length).toFixed(2),avgB=(ps.reduce((s,p)=>s+p.brightness,0)/ps.length).toFixed(2);
    document.getElementById(&quot;poster_portrait&quot;).innerHTML=`<div style=&quot;font-size:12px;line-height:1.9&quot;>
      <div>· <b>主色调</b>：${tones.slice(0,4).map(t=>`<span class=&quot;swatch&quot; style=&quot;background:${toneColor(t[0])}&quot;></span>${t[0]}(${t[1]})`).join(&quot; &quot;)}</div>
      <div>· <b>冷暖</b>：${warm.map(w=>w[0]+`(${w[1]})`).join(&quot;、&quot;)} · <b>饱和度</b>：均${avgS} ${sat.map(s=>s[0]+`(${s[1]})`).join(&quot;、&quot;)}</div>
      <div>· <b>明度</b>：均${avgB} · <b>IP表现力</b>：${ip.map(i=>i[0]+`(${i[1]})`).join(&quot;、&quot;)}</div>
      <div style=&quot;margin-top:4px;color:#8a5a12&quot;>→ 优酷首屏画像：${warm[0]?warm[0][0]:''}为主、${sat[0]?sat[0][0]:''}、IP主体${ip[0]?ip[0][0]:''}突出</div></div>`;
  } else document.getElementById(&quot;poster_portrait&quot;).innerHTML='<div style=&quot;color:var(--ink-soft);padding:8px&quot;>海报分析无数据</div>';
})();

  `结构与爱奇艺/腾讯对齐;优酷无账号体系故略账号模块;⚠优酷接口无上线日期(黑马暂无法判定)、年龄筛选headless不可靠(分龄暂留全年龄)。热度=互动量trackShow.count。`;

<script>
function resizeIframe(key){
  var f=document.getElementById('if-'+key);
  try{ f.contentWindow.dispatchEvent(new Event('resize')); }catch(e){}
}
function showTab(key){
  document.querySelectorAll('.ctab').forEach(function(b){b.classList.toggle('active',b.dataset.key===key);});
  document.querySelectorAll('.cpanel').forEach(function(p){p.classList.remove('active');});
  var panel=document.getElementById('panel-'+key);
  var f=document.getElementById('if-'+key);
  if(f && !f.getAttribute('srcdoc') && panel.dataset.html){  // 惰性加载:首次点击才注入
    f.setAttribute('srcdoc', panel.dataset.html);
    f.addEventListener('load', function(){ setTimeout(function(){resizeIframe(key);},60); }, {once:true});
  } else { setTimeout(function(){resizeIframe(key);},60); }
  panel.classList.add('active');
}
</script>
